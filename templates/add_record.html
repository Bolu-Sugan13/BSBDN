{% extends "base.html" %}
{% block title %}Add Vitals{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:0 auto;">
  <h1>Record new vitals</h1>
  <p class="muted">Enter a reading manually, or select a source to simulate an import from a
     wearable device export or hospital record feed.</p>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Source</label>
    <select name="source">
      <option value="manual">Manual entry</option>
      <option value="wearable">Wearable device export</option>
      <option value="hospital">Hospital record</option>
    </select>
    <label>Heart rate (bpm) <span class="muted">[20 - 250]</span></label>
    <input type="number" step="1" min="20" max="250" name="heart_rate" value="{{ form_data.heart_rate if form_data else '' }}" required placeholder="e.g. 72">
    <label>Blood pressure — systolic (mmHg) <span class="muted">[50 - 260]</span></label>
    <input type="number" step="1" min="50" max="260" name="bp_sys" value="{{ form_data.bp_sys if form_data else '' }}" required placeholder="e.g. 118">
    <label>Blood pressure — diastolic (mmHg) <span class="muted">[30 - 160]</span></label>
    <input type="number" step="1" min="30" max="160" name="bp_dia" value="{{ form_data.bp_dia if form_data else '' }}" required placeholder="e.g. 76">
    <label>Oxygen level — SpO2 (%) <span class="muted">[50 - 100]</span></label>
    <input type="number" step="0.1" min="50" max="100" name="oxygen_level" value="{{ form_data.oxygen_level if form_data else '' }}" required placeholder="e.g. 98.0">
    <label>Temperature (°C) <span class="muted">[30.0 - 45.0]</span></label>
    <input type="number" step="0.1" min="30" max="45" name="temperature" value="{{ form_data.temperature if form_data else '' }}" required placeholder="e.g. 36.8">
    <label>Notes (optional)</label>
    <textarea name="notes" rows="3" placeholder="Any observed symptoms or context...">{{ form_data.notes if form_data else '' }}</textarea>
    <button type="submit">Save &amp; write to blockchain</button>
  </form>
</div>
{% endblock %}
